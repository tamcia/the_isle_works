<!DOCTYPE html>
<html>
<head>

<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.2.0/model-viewer.min.js">
</script>

<style>

body{
margin:0;
}
#loading{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%, -50%);
font-family:'Barlow', sans-serif;
font-size:18px;
color:gray;
text-align:center;
animation:pulse 1.5s infinite;
}
@keyframes pulse{
0%{opacity:0.4;}
50%{opacity:1;}
100%{opacity:0.4;}
}
#ios-warning{
display:none;
position:absolute;
top:50%;
left:50%;
transform:translate(-50%, -50%);
font-family:'Barlow', sans-serif;
font-size:18px;
font-weight:400;
color:gray;
text-align:center;
}
model-viewer{
width:100vw;
height:100vh;
}
model-viewer::part(default-progress-bar){
display:none;
}
</style>

</head>

<body>

<div id="loading">
Loading The Isle 03...
</div>

<div id="ios-warning">
Oops! Unfortunately, the Isle 03 model isn't available on iOS. If you'd like to see it, please get in touch with Tamara, the designer - she may be able to provide an alternative way to view it.
</div>

<model-viewer
src="models/The_Isle_03.glb"
ar
ar-modes="webxr scene-viewer"
camera-controls
auto-rotate>

<button slot="ar-button">
View in AR
</button>

</model-viewer>

<script>

document
.querySelector("model-viewer")
.addEventListener("load",()=>{
document.getElementById("loading").style.display="none";
});

const isIOS =
/iPad|iPhone|iPod/.test(navigator.userAgent);

if(isIOS){
document.getElementById("ios-warning").style.display="block";
}

</script>

</body>
</html>
